name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://starter:starter@127.0.0.1:5432/starter
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      APP_BASE_URL: http://127.0.0.1:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - run: bun install --frozen-lockfile
      - run: docker compose build app
      - run: docker compose up -d --wait postgres
      - run: docker compose run --rm migrate
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - run: docker compose up -d --wait app
      - run: curl --fail --show-error http://127.0.0.1:3000/api/health
      - if: always()
        run: docker compose down --volumes --remove-orphans
