name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  add-on-matrix:
    runs-on: ubuntu-latest
    outputs:
      capabilities: ${{ steps.catalog.outputs.capabilities }}
    steps:
      - uses: actions/checkout@v5
      - id: catalog
        run: |
          capability_matrix=$(jq -c '[.capabilities[] | select((.status == "done" or .status == "in-progress") and .tanstackAddOn != null) | .id]' capabilities/catalog.json)
          echo "capabilities=$capability_matrix" >> "$GITHUB_OUTPUT"

  custom-add-ons:
    needs: add-on-matrix
    runs-on: ubuntu-latest
    env:
      ADD_ON_TEST_DATABASE_URL: postgresql://starter:starter@127.0.0.1:5432/starter
      BETTER_AUTH_SECRET: add-on-ci-secret-with-at-least-32-characters
      APP_BASE_URL: http://127.0.0.1:3000
    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_DB: starter
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: starter
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U starter -d starter"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    strategy:
      fail-fast: false
      matrix:
        capability: ${{ fromJSON(needs.add-on-matrix.outputs.capabilities) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24.21.0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - name: Verify lifecycle runtime versions
        run: |
          node -e "if (process.versions.node.split('.')[0] !== '24') throw new Error('Lifecycle fixtures require Node 24'); console.log('Node ' + process.version)"
          bun --version
          bun --revision
      - run: bun install --frozen-lockfile
      - run: bun run add-ons:test ${{ matrix.capability }}

  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://starter:starter@127.0.0.1:5432/starter
      OPS_ADMIN_USER_IDS: ops-e2e-operator
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      APP_BASE_URL: http://127.0.0.1:3000
      NODE_ENV: test
      REALTIME_TRANSPORTS: sse,websocket
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24.21.0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - name: Verify baseline runtime versions
        run: |
          node -e "if (process.versions.node.split('.')[0] !== '24') throw new Error('Baseline checks require Node 24'); console.log('Node ' + process.version)"
          bun --version
          bun --revision
      - run: bun install --frozen-lockfile
      - run: bun run agents:check
      - run: bun run agents:test
      - run: bun run capabilities:status
      - run: bun run capabilities:check
      - run: bun run project:check
      - run: bun run project:status
      - run: bun run theme:check
      - run: docker compose build app
      - run: bun run db:persistence:test
      - run: docker compose up -d --wait postgres
      - run: docker compose run --rm migrate
      - run: docker compose run --rm jobs-migrate
      - run: bun run production:smoke
      - run: docker compose run --rm worker node .output/notifications-smoke.mjs
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run add-ons:test:composition
      - run: bun run observability:smoke
      - name: Verify ephemeral cache on actual Valkey and optional safe telemetry
        run: |
          bun run cache:unit
          bun run cache:telemetry
          bun build scripts/cache-smoke.ts --target=node --outfile=/tmp/cache-smoke.mjs
          CACHE_COMPAT_NODE_SCRIPT=/tmp/cache-smoke.mjs bun run cache:compat
          bun run realtime:cache
      - name: Verify Node realtime transports and private notification delivery
        run: |
          bun run realtime:transport
          bun run notifications:unit
          bun run notifications:smoke
          bun run notifications:compat
          bun run notifications:delivery
      - name: Verify both storage providers, optional reference telemetry and Garage UI
        run: STORAGE_SMOKE_IMAGE=tanstack-launchpad:local STORAGE_SMOKE_SCRIPT=scripts/storage-reference-smoke.ts bun run storage:compat --garage-ui
      - name: Verify SMTP, Chaos, Better Auth and production magic-link delivery
        run: bun run email:compat --reference --production
      - run: bun test
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - run: docker compose up -d worker
      - run: docker compose up -d --wait app
      - run: test "$(docker compose ps --status running --services worker)" = worker
      - run: curl --fail --show-error http://127.0.0.1:3000/api/health | jq -e '.status == "ok" and .environment == "production" and .checks.database == "ok"'
      - name: Verify container request correlation
        run: |
          curl --fail --show-error -D - -o /dev/null -H 'X-Request-ID: container-smoke' http://127.0.0.1:3000/api/health | grep -i 'x-request-id: container-smoke'
      - run: curl --fail --show-error http://127.0.0.1:3000/api/openapi.json | jq -e '.openapi == "3.1.1"'
      - run: curl --fail --show-error --output /dev/null http://127.0.0.1:3000/docs/api
      - name: Verify production appearance and hydration
        run: E2E_BASE_URL=http://127.0.0.1:3000 bun run test:e2e
      - if: always()
        run: docker compose down --volumes --remove-orphans
