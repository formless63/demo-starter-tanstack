name: tanstack-launchpad

x-app-image: &app-image
  image: ${APP_IMAGE:-tanstack-launchpad:local}
  build:
    context: .
    dockerfile: Dockerfile

x-database-environment: &database-environment
  POSTGRES_DB: ${POSTGRES_DB:-starter}
  POSTGRES_USER: ${POSTGRES_USER:-starter}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-starter}

x-jobs-environment: &jobs-environment
  NODE_ENV: production
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
  APP_BASE_URL: ${APP_BASE_URL:-}
  NTFY_BASE_URL: ${NTFY_BASE_URL:-}
  NTFY_TOKEN: ${NTFY_TOKEN:-}
  NTFY_TIMEOUT_SECONDS: ${NTFY_TIMEOUT_SECONDS:-10}
  NTFY_REFERENCE_RECIPIENT_ID: ${NTFY_REFERENCE_RECIPIENT_ID:-}
  NTFY_REFERENCE_TOPIC: ${NTFY_REFERENCE_TOPIC:-}
  DATABASE_URL: postgresql://${POSTGRES_USER:-starter}:${POSTGRES_PASSWORD:-starter}@postgres:5432/${POSTGRES_DB:-starter}
  PGBOSS_DATABASE_URL: ${PGBOSS_DATABASE_URL:-postgresql://${POSTGRES_USER:-starter}:${POSTGRES_PASSWORD:-starter}@postgres:5432/${POSTGRES_DB:-starter}}
  WEBHOOK_REFERENCE_URL: ${WEBHOOK_REFERENCE_URL:-}
  WEBHOOK_REFERENCE_SECRET: ${WEBHOOK_REFERENCE_SECRET:-}
  IMPORT_EXPORT_MAX_BYTES: ${IMPORT_EXPORT_MAX_BYTES:-16777216}
  IMPORT_EXPORT_MAX_ROWS: ${IMPORT_EXPORT_MAX_ROWS:-10000}
  IMPORT_EXPORT_TIMEOUT_SECONDS: ${IMPORT_EXPORT_TIMEOUT_SECONDS:-60}
  IMPORT_EXPORT_ARTIFACT_TTL_SECONDS: ${IMPORT_EXPORT_ARTIFACT_TTL_SECONDS:-86400}
  STORAGE_BUCKET: ${STORAGE_BUCKET:-}
  STORAGE_REGION: ${STORAGE_REGION:-}
  STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
  STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
  STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
  STORAGE_SESSION_TOKEN: ${STORAGE_SESSION_TOKEN:-}
  STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-}
  STORAGE_PRESIGN_TTL_SECONDS: ${STORAGE_PRESIGN_TTL_SECONDS:-600}
  STORAGE_KEY_PREFIX: ${STORAGE_KEY_PREFIX:-}
  PGBOSS_SCHEMA: ${PGBOSS_SCHEMA:-pgboss}
  PGBOSS_USE_LISTEN_NOTIFY: ${PGBOSS_USE_LISTEN_NOTIFY:-false}

x-observability-environment: &observability-environment
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-tanstack-app}
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-}
  OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-}
  OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
  APP_VERSION: ${APP_VERSION:-}
  APP_REVISION: ${APP_REVISION:-}
  DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_REDACT_FIELDS: ${LOG_REDACT_FIELDS:-}

services:
  postgres:
    image: postgres:18.1-alpine
    environment: *database-environment
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app-image
    command: ["node", ".output/migrate.mjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-starter}:${POSTGRES_PASSWORD:-starter}@postgres:5432/${POSTGRES_DB:-starter}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  jobs-migrate:
    <<: *app-image
    command: ["node", ".output/jobs-migrate.mjs"]
    environment: *jobs-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  worker:
    <<: *app-image
    command: ["node", ".output/jobs-worker.mjs"]
    environment:
      <<: [*jobs-environment, *observability-environment]
      JOBS_CONCURRENCY: ${JOBS_CONCURRENCY:-4}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-}
      EMAIL_MAX_RECIPIENTS: ${EMAIL_MAX_RECIPIENTS:-50}
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    stop_grace_period: 35s
    restart: unless-stopped

  app:
    <<: *app-image
    environment:
      <<: [*jobs-environment, *observability-environment]
      NODE_ENV: production
      REALTIME_TRANSPORTS: ${REALTIME_TRANSPORTS:-sse}
      DATABASE_URL: postgresql://${POSTGRES_USER:-starter}:${POSTGRES_PASSWORD:-starter}@postgres:5432/${POSTGRES_DB:-starter}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      MAGIC_LINK_ENABLED: ${MAGIC_LINK_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-}
      EMAIL_REPLY_TO_ADDRESS: ${EMAIL_REPLY_TO_ADDRESS:-}
      EMAIL_REPLY_TO_NAME: ${EMAIL_REPLY_TO_NAME:-}
      EMAIL_MAX_RECIPIENTS: ${EMAIL_MAX_RECIPIENTS:-50}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_REGION: ${STORAGE_REGION:-}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
      STORAGE_SESSION_TOKEN: ${STORAGE_SESSION_TOKEN:-}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-}
      STORAGE_PRESIGN_TTL_SECONDS: ${STORAGE_PRESIGN_TTL_SECONDS:-600}
      STORAGE_KEY_PREFIX: ${STORAGE_KEY_PREFIX:-}
    ports: ["${APP_PORT:-3000}:3000"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
