name: tanstack-launchpad

x-app-image: &app-image
  image: ${APP_IMAGE:-tanstack-launchpad:local}
  build:
    context: .
    dockerfile: Dockerfile

x-database-environment: &database-environment
  POSTGRES_DB: ${POSTGRES_DB:-starter}
  POSTGRES_USER: ${POSTGRES_USER:-starter}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-starter}

services:
  postgres:
    image: postgres:18.1-alpine
    environment: *database-environment
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app-image
    command: ["node", ".output/migrate.mjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-starter}:${POSTGRES_PASSWORD:-starter}@postgres:5432/${POSTGRES_DB:-starter}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    <<: *app-image
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-starter}:${POSTGRES_PASSWORD:-starter}@postgres:5432/${POSTGRES_DB:-starter}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      MAGIC_LINK_ENABLED: ${MAGIC_LINK_ENABLED:-false}
    ports: ["${APP_PORT:-3000}:3000"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
